name: Feature request
description: An idea for a new capability or an improvement
title: "[FEAT] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: e.g. "Screen mode warm-up is hard to understand" or "I want per-game gain presets".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Performance (chain / GEMM)
        - Vulkan layer / DXGI proxy
        - Manager UI (m13)
        - Screen / window mode (m8b-live)
        - Validation / tooling
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
